name: gscanner
description: "Scan food barcodes instantly to detect hidden gluten, lactose, and suspicious additives. A 100% free, privacy-focused ingredient scanner for celiacs and food intolerances."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  shared_preferences: ^2.2.2
  http: ^1.1.0
  mobile_scanner: ^7.2.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.7
  skeletonizer: ^2.1.3
  permission_handler: ^12.0.3
  web: ^1.1.0
  url_launcher: ^6.3.2
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  # Configurazione Base (fallback per sistemi vecchi)
  image_path: "assets/logo/app_icon_solid.png"
  # --- ANDROID ---
  android: true
  adaptive_icon_background: "#BFDEB4"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png" # Logo trasparente
  # --- IOS ---
  ios: true
  remove_alpha_ios: true # Sicurezza extra: rimuove la trasparenza se per sbaglio metti un file sbagliato
  image_path_ios: "assets/logo/app_icon_solid.png" # iOS usa il logo con sfondo integrato
  # --- WEB ---
  web:
    generate: true
    image_path: "assets/logo/app_icon_solid.png"
    background_color: "#BFDEB4"
    theme_color: "#0D631B" # Il verde primario della tua app (primaryContainer)
  # # --- WINDOWS (Opzionale, se generi la build Desktop) ---
  # windows:
  #   generate: true
  #   image_path: "assets/logo/app_icon_solid.png"
  #   icon_size: 256 # Consigliato per Windows
  # # --- MACOS (Opzionale, se generi la build Desktop) ---
  # macos:
  #   generate: true
  #   image_path: "assets/logo/app_icon_solid.png"

flutter_native_splash:
  # Colore di sfondo (Light Mode)
  color: "#BFDEB4"
  # Percorso della tua immagine PNG
  image: "assets/splash/splash_icon.png"
  
  # (Opzionale) Configurazione per la Dark Mode
  # color_dark: "#121212"
  # image_dark: "assets/splash/logo_dark.png"

  # Le piattaforme per cui vuoi generare la splash
  android: true
  ios: true
  web: true

  # Configurazione specifica e obbligatoria per i dispositivi Android 12 e superiori
  android_12:
    image: "assets/splash/splash_icon.png"
    color: "#BFDEB4"
    # image_dark: "assets/splash/splash_icon_dark.png"
    # color_dark: "#121212"

flutter:
  uses-material-design: true
  assets:
    - assets/locales/it/
    - assets/icons/
    - assets/logo/
    - assets/splash/
